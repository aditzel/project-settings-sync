name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# JANUS_PSS_CI_MODE=janus moves trusted Linux tests/build to Janus.
# macOS stays hosted; forks and other modes retain the complete hosted path.
# Review fork workflow changes before approving: routing is not a runner access boundary.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: ${{ fromJSON(vars.JANUS_PSS_CI_MODE == 'janus' && github.repository == 'aditzel/project-settings-sync' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main')) && '["macos-latest"]' || '["ubuntu-24.04","macos-latest"]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Capture native source identity
        if: matrix.os == 'macos-latest' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          env -i PATH="$PATH" \
            GITHUB_SERVER_URL="$GITHUB_SERVER_URL" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REPOSITORY_ID="$GITHUB_REPOSITORY_ID" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            GITHUB_REF="$GITHUB_REF" GITHUB_BASE_REF="$GITHUB_BASE_REF" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_WORKFLOW="$GITHUB_WORKFLOW" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_WORKFLOW_SHA="$GITHUB_WORKFLOW_SHA" GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
            bun --no-env-file --no-install --config=/dev/null "$GITHUB_WORKSPACE/scripts/ci/native-source.ts"

      - name: Upload native source identity
        if: matrix.os == 'macos-latest' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-macos-source-${{ github.run_id }}-${{ github.run_attempt }}/source.json
          if-no-files-found: error
          retention-days: 36
          overwrite: false

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: |
          python3 -I scripts/test-ci-status-bridge.py
          bun test

  build:
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      statuses: read
    needs: test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ !(vars.JANUS_PSS_CI_MODE == 'janus' && github.repository == 'aditzel/project-settings-sync' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main'))) && needs.test.result == 'success' }}
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ !(vars.JANUS_PSS_CI_MODE == 'janus' && github.repository == 'aditzel/project-settings-sync' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main'))) && needs.test.result == 'success' }}
        with:
          bun-version: latest

      - name: Install dependencies
        if: ${{ !(vars.JANUS_PSS_CI_MODE == 'janus' && github.repository == 'aditzel/project-settings-sync' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main'))) && needs.test.result == 'success' }}
        run: bun install

      - name: Build
        if: ${{ !(vars.JANUS_PSS_CI_MODE == 'janus' && github.repository == 'aditzel/project-settings-sync' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main'))) && needs.test.result == 'success' }}
        run: bun run build
      - name: Reject canceled CI
        if: cancelled()
        run: exit 1
      - name: Verify required CI
        env:
          HOSTED_RESULTS: ${{ toJSON(needs) }}
          REQUIRED_HOSTED_JOBS: '["test"]'
          USE_JANUS: ${{ vars.JANUS_PSS_CI_MODE == 'janus' && github.repository == 'aditzel/project-settings-sync' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main')) }}
          EXPECTED_REPOSITORY: aditzel/project-settings-sync
          JANUS_PIPELINE: project-settings-sync-shadow-ci
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import http.client
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request


          def selected_status(rows, context, pipeline):
              if not isinstance(rows, list):
                  raise ValueError('GitHub status response must be a list')
              # The commit-status endpoint returns newest first. Never fall back to an
              # older success when the latest matching status is pending or failed.
              row = next((item for item in rows if item.get('context') == context), None)
              if row is None:
                  return None
              creator = row.get('creator') or {}
              if (creator.get('id'), creator.get('login'), creator.get('type')) != (
                  20291210, 'buildkite-limited-access[bot]', 'Bot'
              ):
                  raise ValueError('Janus status was not written by the approved Buildkite app')
              prefix = 'https://buildkite.com/mirai-forge/' + pipeline + '/builds/'
              if not re.fullmatch(re.escape(prefix) + r'[1-9][0-9]*', row.get('target_url') or ''):
                  raise ValueError('Janus aggregate target is not the approved pipeline build')
              state = row.get('state')
              if state not in ('pending', 'success', 'failure', 'error'):
                  raise ValueError('Unknown Janus status state')
              return state


          def main():
              needs = json.loads(os.environ['HOSTED_RESULTS'])
              use_janus = os.environ['USE_JANUS'] == 'true'
              required = json.loads(os.environ.get('REQUIRED_HOSTED_JOBS', '[]'))
              allowed = ('success', 'skipped') if use_janus else ('success',)
              if (not needs or any(job.get('result') not in allowed for job in needs.values())
                      or any(needs.get(name, {}).get('result') != 'success' for name in required)):
                  raise SystemExit('A required hosted job did not pass')
              if not use_janus:
                  print('Required hosted jobs passed')
                  return
              repository = os.environ['EXPECTED_REPOSITORY']
              pipeline = os.environ['JANUS_PIPELINE']
              if os.environ['GITHUB_REPOSITORY'] != repository:
                  raise SystemExit('Repository identity mismatch')
              with open(os.environ['GITHUB_EVENT_PATH']) as event_file:
                  event = json.load(event_file)
              if os.environ['GITHUB_EVENT_NAME'] == 'pull_request':
                  pr = event['pull_request']
                  if pr['head']['repo']['full_name'] != repository or pr['base']['ref'] != 'main':
                      raise SystemExit('Janus requires a same-repository PR targeting main')
                  sha = pr['head']['sha']
                  context = 'buildkite/' + pipeline + '/pr'
              elif os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF'] == 'refs/heads/main':
                  sha = os.environ['GITHUB_SHA']
                  context = 'buildkite/' + pipeline
              else:
                  raise SystemExit('Event is not admitted to Janus ordinary CI')
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise SystemExit('Source must be an exact commit')
              url = 'https://api.github.com/repos/' + repository + '/commits/' + sha + '/statuses?per_page=100&page='
              headers = {
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              deadline = time.monotonic() + 30 * 60
              page = 1
              # The shared cap counts every page and every failed request.
              for _ in range(121):
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      break
                  delay = 15
                  request = urllib.request.Request(url + str(page), headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=min(10, remaining)) as response:
                          rows = json.load(response)
                  except urllib.error.HTTPError as error:
                      retry_after = error.headers.get('Retry-After', '') if error.headers else ''
                      reset = error.headers.get('X-RateLimit-Reset', '') if error.headers else ''
                      exhausted = error.headers and error.headers.get('X-RateLimit-Remaining') == '0'
                      retryable = error.code in (429, 500, 502, 503, 504)
                      limited = False
                      try:
                          limited = error.code == 403 and (
                              bool(retry_after) or exhausted or 'secondary rate limit' in
                              error.read(4096).decode('utf-8', errors='replace').lower()
                          )
                      except (OSError, http.client.HTTPException):
                          retryable = True
                      finally:
                          error.close()
                      if not limited and not retryable:
                          raise
                      if retry_after.isdigit():
                          delay = max(delay, int(retry_after))
                      if exhausted and reset.isdigit():
                          delay = max(delay, int(reset) - time.time())
                  except (OSError, http.client.HTTPException, json.JSONDecodeError):
                      pass
                  else:
                      state = selected_status(rows, context, pipeline)
                      if state == 'success':
                          print('Verified ' + context + ' for ' + sha)
                          return
                      if state in ('failure', 'error'):
                          raise SystemExit('Janus ordinary CI failed for ' + sha)
                      if state is None and len(rows) == 100:
                          page += 1
                          continue
                  page = 1
                  time.sleep(min(delay, max(0, deadline - time.monotonic())))
              raise SystemExit('Janus ordinary CI did not pass within 30 minutes or 121 reads')


          if __name__ == '__main__':
              main()
          PY
